name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # Build inside kali-rolling: it ships Drogon 1.9.12, matching the dev host and
    # the Docker image. Debian/Ubuntu stable have Drogon 1.8.x, too old for the
    # streaming API nexus-api uses (newAsyncStreamResponse, added in Drogon 1.9.4).
    container: kalilinux/kali-rolling
    steps:
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            git \
            ca-certificates \
            dpkg-dev \
            gnupg \
            libargon2-dev \
            libdrogon-dev \
            libpqxx-dev \
            libssl-dev \
            libuv1-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libjsoncpp-dev \
            uuid-dev \
            libsqlite3-dev \
            libmariadb-dev \
            libhiredis-dev \
            libbrotli-dev \
            libc-ares-dev \
            libyaml-cpp-dev \
            nodejs \
            npm

      - uses: actions/checkout@v5

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Configure CMake
        run: cmake --preset dev

      - name: Build backend
        run: cmake --build --preset dev

      - name: Backend tests
        run: ctest --test-dir build/dev --output-on-failure

      - name: Frontend lint
        run: cd frontend && npm run lint && npm run typecheck

      - name: Frontend tests
        run: cd frontend && npm run test -- --run

      - name: Frontend build
        run: cd frontend && npm run build
